<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Fingerprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<!-- Fingerprint app v0 (24 Nov, decided in the Fingerprint chat): private — sign-in + allow-list, nothing published.
     Milestone 1: sign-in gate, empty shell, tab bar Collection · Movers · Compare, design tokens, data views (fp_*). -->
<style>
:root{
  --bg:#F4F4F6;--card:#FFFFFF;--ink:#111214;--muted:#6B6B72;--rule:#DADADF;--fill:#EBEBEF;
  --fp-1:#FFC98A;--fp-2:#FFAE42;--fp-3:#FF7A00;--fp-up:#C2540A;--gr-1:#DEDEE2;--gr-2:#B4B4BA;--gr-3:#7E7E84;
  --sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000;--card:#1C1C1E;--ink:#FFFFFF;--muted:#98989F;--rule:#38383A;--fill:#2C2C2E;
  --fp-1:#8F5A1E;--fp-2:#D9862A;--fp-3:#FF8A0A;--fp-up:#FF9A2E;--gr-1:#3A3A3E;--gr-2:#5E5E64;--gr-3:#8E8E94;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000;--card:#1C1C1E;--ink:#FFFFFF;--muted:#98989F;--rule:#38383A;--fill:#2C2C2E;
  --fp-1:#8F5A1E;--fp-2:#D9862A;--fp-3:#FF8A0A;--fp-up:#FF9A2E;--gr-1:#3A3A3E;--gr-2:#5E5E64;--gr-3:#8E8E94;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sf);-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 96px) max(16px,env(safe-area-inset-left,0px))}
.label{font:500 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:6px 0 2px;font-size:34px;line-height:41px;font-weight:700;letter-spacing:.005em}
.sub{margin:0 0 16px;font-size:15px;color:var(--muted)}
.box{background:var(--card);border-radius:12px;padding:16px}
.empty{text-align:center;padding:36px 20px}
.empty p{margin:8px 0 0;font-size:15px;line-height:1.45;color:var(--muted)}
.ring{width:64px;height:64px;margin:0 auto;display:block}
/* sign-in */
.gate{max-width:360px;margin:12vh auto 0}
.gate .mark{width:56px;height:56px;border-radius:13px;display:block;margin:0 0 14px}
.gate label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.gate input{width:100%;font:17px var(--sf);padding:12px 14px;border-radius:10px;border:1px solid var(--rule);background:var(--card);color:var(--ink);min-height:44px}
.gate button{width:100%;margin-top:18px;min-height:48px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font:600 17px var(--sf);cursor:pointer}
.gate .msg{min-height:20px;margin-top:12px;font-size:14px;color:var(--muted)}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:.5px solid var(--rule);display:grid;grid-template-columns:repeat(3,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 6px) max(8px,env(safe-area-inset-left,0px));z-index:5}
.tabbar button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:50px;font-size:10px;font-weight:500;color:var(--muted)}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar button:focus-visible{outline:2px solid var(--ink);outline-offset:-4px;border-radius:10px}
.tabbar svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.top button{all:unset;cursor:pointer;font-size:15px;color:var(--muted);min-height:44px;display:flex;align-items:center}
.private{font:500 11px var(--mono);letter-spacing:.06em;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:3px 9px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<div id="gate" class="wrap" hidden>
  <div class="gate">
    <img class="mark" src="icon-180.png" alt="" width="56" height="56">
    <div class="label">HoloTrack Pro · Fingerprint</div>
    <h1>Sign in</h1>
    <p class="sub" style="margin-bottom:4px">Private preview. Use your HoloTrack account.</p>
    <form id="f">
      <label for="em">E-mail</label><input id="em" type="email" autocomplete="username" required>
      <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
      <div class="msg" id="msg" role="status"></div>
    </form>
  </div>
</div>

<div id="app" hidden>
  <main class="wrap" id="view"></main>
  <nav class="tabbar" aria-label="Fingerprint">
    <button data-tab="collection"><svg viewBox="0 0 26 26"><rect x="4" y="5" width="7" height="16" rx="1.5"/><rect x="15" y="5" width="7" height="16" rx="1.5"/></svg>Collection</button>
    <button data-tab="movers"><svg viewBox="0 0 26 26"><path d="M4 18l6-6 4 4 8-8"/><path d="M17 8h5v5"/></svg>Movers</button>
    <button data-tab="compare"><svg viewBox="0 0 26 26"><path d="M13 4v18M5 9h6M5 13h6M5 17h6M15 9h6M15 13h4M15 17h5"/></svg>Compare</button>
  </nav>
</div>

<script>
const SUPABASE_URL = "https://uhkvzsjaavcbawuhvrkz.supabase.co";
const SUPABASE_KEY = "sb_publishable_ny_oW8k07iVbf2I-WiaORw_wbS83Jid";   // publishable: safe in a page; every fp_ view checks the allow-list
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: "fp-auth" } });
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const FP = { tab: "collection" };

const TABS = {
  collection: () => `<div class="top"><span class="label">Fingerprint</span><span class="private">PRIVATE</span></div>
    <h1>Collection</h1><p class="sub" id="csub">0 cards</p>
    <div class="box empty">
      <svg class="ring" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="26" fill="none" stroke="var(--gr-2)" stroke-width="1.5" stroke-dasharray="2 4"/></svg>
      <p>Your cards appear here with their fingerprints.</p></div>`,
  movers: () => `<div class="top"><span class="label">Fingerprint</span><span class="private">PRIVATE</span></div>
    <h1>Movers</h1><p class="sub">Rising and falling cards over 7, 30 and 90 days.</p>
    <div class="box empty"><p>Coming in a later build.</p></div>`,
  compare: () => `<div class="top"><span class="label">Fingerprint</span><span class="private">PRIVATE</span></div>
    <h1>Compare</h1><p class="sub">Two cards side by side.</p>
    <div class="box empty"><p>Coming in a later build.</p></div>`,
};

function route() {
  const t = (location.hash || "").replace(/^#/, "");
  FP.tab = TABS[t] ? t : "collection";
  $("view").innerHTML = TABS[FP.tab]();
  document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-current", b.dataset.tab === FP.tab ? "page" : "false"));
  window.scrollTo(0, 0);
}
document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { location.hash = b.dataset.tab; });
window.addEventListener("hashchange", route);

const PREVIEW = /^(localhost|127\.)/.test(location.hostname) && /[?&]preview\b/.test(location.search);   // local screenshots only: no data without sign-in
async function start() {
  if (PREVIEW) { $("gate").hidden = true; $("app").hidden = false; route(); return; }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $("gate").hidden = false; $("app").hidden = true; return; }
  const { data: ok, error } = await sb.rpc("fp_allowed");
  if (error || !ok) {
    $("gate").hidden = false; $("app").hidden = true;
    $("msg").textContent = "This preview is private. Your account isn't on the list."; await sb.auth.signOut(); return;
  }
  $("gate").hidden = true; $("app").hidden = false; route();
}
$("f").onsubmit = async e => {
  e.preventDefault(); $("msg").textContent = "Signing in…";
  const { error } = await sb.auth.signInWithPassword({ email: $("em").value.trim(), password: $("pw").value });
  if (error) { $("msg").textContent = "That didn't work. Check the e-mail and password."; return; }
  $("msg").textContent = ""; start();
};
start();
</script>
</body>
</html>
