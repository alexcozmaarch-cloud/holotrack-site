<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Fingerprint</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fingerprint">
<meta name="theme-color" content="#F4F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<!-- Fingerprint app v0 (24 Nov, decided in the Fingerprint chat): private — sign-in + allow-list, nothing published.
     Milestone 1: sign-in gate, empty shell, tab bar Collection · Movers · Compare, design tokens, data views (fp_*). -->
<style>
:root{
  --bg:#F4F4F6;--card:#FFFFFF;--ink:#111214;--muted:#6B6B72;--rule:#DADADF;--fill:#EBEBEF;
  --fp-1:#FFC98A;--fp-2:#FFAE42;--fp-3:#FF7A00;--fp-up:#C2540A;--gr-1:#DEDEE2;--gr-2:#B4B4BA;--gr-3:#7E7E84;
  --sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000;--card:#1C1C1E;--ink:#FFFFFF;--muted:#98989F;--rule:#38383A;--fill:#2C2C2E;
  --fp-1:#8F5A1E;--fp-2:#D9862A;--fp-3:#FF8A0A;--fp-up:#FF9A2E;--gr-1:#3A3A3E;--gr-2:#5E5E64;--gr-3:#8E8E94;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000;--card:#1C1C1E;--ink:#FFFFFF;--muted:#98989F;--rule:#38383A;--fill:#2C2C2E;
  --fp-1:#8F5A1E;--fp-2:#D9862A;--fp-3:#FF8A0A;--fp-up:#FF9A2E;--gr-1:#3A3A3E;--gr-2:#5E5E64;--gr-3:#8E8E94;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sf);-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 96px) max(16px,env(safe-area-inset-left,0px))}
.label{font:500 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:6px 0 2px;font-size:34px;line-height:41px;font-weight:700;letter-spacing:.005em}
.sub{margin:0 0 16px;font-size:15px;color:var(--muted)}
.box{background:var(--card);border-radius:12px;padding:16px}
.empty{text-align:center;padding:36px 20px}
.empty p{margin:8px 0 0;font-size:15px;line-height:1.45;color:var(--muted)}
.ring{width:64px;height:64px;margin:0 auto;display:block}
/* sign-in */
.gate{max-width:360px;margin:12vh auto 0}
.gate .mark{width:56px;height:56px;border-radius:13px;display:block;margin:0 0 14px}
.gate label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.gate input{width:100%;font:17px var(--sf);padding:12px 14px;border-radius:10px;border:1px solid var(--rule);background:var(--card);color:var(--ink);min-height:44px}
.gate button{width:100%;margin-top:18px;min-height:48px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font:600 17px var(--sf);cursor:pointer}
.gate .msg{min-height:20px;margin-top:12px;font-size:14px;color:var(--muted)}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:.5px solid var(--rule);display:grid;grid-template-columns:repeat(3,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 6px) max(8px,env(safe-area-inset-left,0px));z-index:5}
.tabbar button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:50px;font-size:10px;font-weight:500;color:var(--muted)}
.tabbar button[aria-current="page"]{color:var(--ink)}
.tabbar button:focus-visible{outline:2px solid var(--ink);outline-offset:-4px;border-radius:10px}
.tabbar svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.top button{all:unset;cursor:pointer;font-size:15px;color:var(--muted);min-height:44px;display:flex;align-items:center}
.private{font:500 11px var(--mono);letter-spacing:.06em;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:3px 9px}
/* collection (spec §2) */
.list{background:var(--card);border-radius:12px;overflow:hidden}
.crow{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:64px minmax(0,1fr) 8px;gap:12px;align-items:center;padding:10px 14px 10px 10px;border-bottom:.5px solid var(--rule);min-height:84px}
.crow:last-child{border-bottom:0}
.crow:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.mini svg{width:64px;height:64px;display:block}
.cm{display:flex;flex-direction:column;gap:2px;min-width:0}
.cm b{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm>span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv{font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink)}
.cv em{font-style:normal;font-weight:700;margin-left:6px}
em.up{color:var(--fp-up)}em.dn{color:var(--muted)}
.cv i{font-style:normal;color:var(--muted);font-size:13px;margin-left:6px}
.chev{width:8px;height:14px;stroke:var(--rule);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.foot{margin:12px 4px 0;font-size:13px;line-height:1.4;color:var(--muted)}
.none{font:500 9px var(--mono);fill:var(--muted);letter-spacing:.04em}
/* card (spec §3.1, §4) */
.cardt{font-size:32px;line-height:39px}
.nick{margin:2px 0 2px;font-size:15px;color:var(--muted)}
.sfoot{margin:18px 0 0;font-size:12px;line-height:17px;color:var(--muted)}.sfoot a{color:inherit}
.segc{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;margin:0 0 12px}
.segc button{all:unset;cursor:pointer;text-align:center;font-size:13px;font-weight:600;padding:7px 0;border-radius:7px;color:var(--ink);min-height:30px}
.segc button[aria-selected="true"]{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12)}
.segc button:disabled{color:var(--muted);cursor:default}
.box+.box{margin-top:12px}
.hd{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.hd small{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.hd .mk b{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hd .fr{text-align:right}.hd .fr b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.hd .fr em{font-style:normal;font-weight:700;margin-left:6px}
em.up,b.up{color:var(--fp-up)}
.bar{position:relative;height:22px;margin:14px 0 4px}
.bar .b80{position:absolute;top:8px;height:6px;border-radius:3px;background:var(--fill)}
.bar .b50{position:absolute;top:6px;height:10px;border-radius:5px;background:var(--gr-1)}
.bar .fair{position:absolute;top:2px;width:2px;height:18px;margin-left:-1px;background:var(--ink)}
.bar .mkt{position:absolute;top:5px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--gr-3);border:2px solid var(--card)}
.bar .mkt.above{background:var(--fp-3)}
.bar .mkt.out.r::after{content:"";position:absolute;left:11px;top:0;border:4px solid transparent;border-left:6px solid var(--fp-3)}
.bar .mkt.out.l::after{content:"";position:absolute;right:11px;top:0;border:4px solid transparent;border-right:6px solid var(--gr-3)}
.bl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ctx{margin:8px 0 0;font-size:13px;line-height:1.4;color:var(--muted)}
.facts{margin-top:10px;padding-top:10px;border-top:.5px solid var(--rule);font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.facts b{color:var(--ink);font-weight:600}
.src{margin:8px 0 0;font-size:11px;color:var(--muted)}
.flowph p{margin:0;font-size:13px;color:var(--muted);line-height:1.4}
.plist{padding:4px 0}
.pg+.pg{border-top:.5px solid var(--rule)}
.pgh{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 16px 4px}
.pr{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:44px;padding:8px 16px;font-size:15px}
.pr i{font:400 11px var(--mono);font-style:normal;color:var(--muted);margin-left:8px}
.pr .pv{font-variant-numeric:tabular-nums;text-align:right;font-size:14px;max-width:62%}
.pr .pv.up{color:var(--fp-up);font-weight:700}.pr .pv.m{color:var(--muted)}
.pr:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.more{all:unset;cursor:pointer;display:block;padding:10px 16px 14px;font-size:15px;color:var(--ink);font-weight:600;min-height:24px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:78vh;overflow-y:auto;background:var(--card);border-radius:14px 14px 0 0;z-index:10;transform:translateY(105%);transition:transform .25s;
  padding:8px max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(20px,env(safe-area-inset-left,0px));max-width:560px;margin:0 auto}
.sheet.on{transform:none}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--rule);margin:0 auto 10px}
.shd{display:flex;justify-content:space-between;align-items:center}
.shd button{all:unset;cursor:pointer;font-weight:600;font-size:17px;min-height:44px;display:flex;align-items:center}
.sheet h2{margin:2px 0 8px;font-size:24px}
.sheet h3{margin:16px 0 4px;font-size:13px;color:var(--muted);font-weight:600}
.sheet p{margin:0;font-size:15px;line-height:1.45}
.chip{display:inline-block;font-size:12px;font-weight:600;border:1px solid var(--rule);border-radius:999px;padding:3px 10px;color:var(--muted)}
.chip.ink{background:var(--ink);color:var(--card);border-color:var(--ink)}
.on{margin-top:14px;background:var(--bg);border-radius:10px;padding:12px}
.on .big{display:block;font-size:28px;margin:4px 0}
.snav{display:flex;justify-content:space-between;margin-top:18px}
.snav button{all:unset;cursor:pointer;font-size:15px;font-weight:600;min-height:44px;display:flex;align-items:center}
/* flow (spec §3.1) */
.flowbox{padding:8px 4px 6px}
svg.flow{width:100%;height:auto;display:block;overflow:visible}
svg.flow .hair{fill:none;stroke:var(--muted);stroke-width:.6px;opacity:.28}
svg.flow .str,svg.flow .str2{fill:none;stroke-width:.9px}
svg.flow .sieve{stroke:var(--ink);stroke-width:1.2px}
svg.flow .tick{stroke:var(--muted);stroke-width:.7px}
svg.flow .fam{font:600 10px var(--mono);letter-spacing:.12em;fill:var(--ink)}
svg.flow .fam.sm{font-size:8px;fill:var(--muted)}
svg.flow .res{font:600 11px var(--mono);letter-spacing:.1em;fill:var(--muted)}
svg.flow .res.on{fill:var(--fp-up)}
svg.flow .resa{fill:none;stroke:var(--fp-3);stroke-width:3px}
svg.flow .hit{fill:transparent;cursor:pointer}
svg.flow .hit.hl{fill:var(--ink);fill-opacity:.05}
svg.flow.dim [data-p]{opacity:.12}
svg.flow.dim [data-p].hl{opacity:1;stroke-width:1.6px}
svg.flow.dim .hair.hl{stroke:var(--ink);opacity:.9}
.hint{font-size:12px;color:var(--muted);text-align:center;margin:4px 0 2px}
.pv .nw{white-space:nowrap}
/* why + history (spec §3.2, §3.3) */
.why{margin:0 0 8px;font-size:15px;line-height:1.45}.why.m{color:var(--muted)}
.wchart{width:100%;height:auto;display:block;margin-top:8px}
.wchart .wl{font-size:12px;fill:var(--ink)}.wchart .wv{font:600 12px var(--mono);fill:var(--muted)}.wchart .wv.up{fill:var(--fp-up)}
.wchart .wr{font:400 10px var(--mono);fill:var(--muted)}
.wchart .wdot{fill:var(--ink)}.wchart .wup{fill:var(--fp-3)}.wchart .wdn{fill:var(--gr-2)}
.wchart .wband{fill:var(--gr-1)}.wchart .wtick{stroke:var(--ink);stroke-width:2}
.wchart .wmkt{fill:var(--gr-2)}.wchart .wmkt.up{fill:var(--fp-1)}
.note{margin:8px 0 0;font-size:12px;line-height:1.4;color:var(--muted)}
.ringbox svg.fp.big{width:100%;height:auto;display:block;touch-action:none;cursor:crosshair}
.ro{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-variant-numeric:tabular-nums;margin-bottom:6px}
.ro .d{font-size:13px;color:var(--muted)}.ro .g{font-size:17px;font-weight:700;text-align:right;grid-row:span 2;align-self:center}
.ro .m{font-size:22px;font-weight:700}.ro .s{grid-column:1/-1;font-size:13px;color:var(--muted)}
.ro .up{color:var(--fp-up)}.ro .dn{color:var(--muted)}
input[type=range]{width:100%;margin:10px 0 0;accent-color:var(--ink);min-height:30px}
svg.fp .ev{fill:var(--ink);stroke:var(--card);stroke-width:1.2;cursor:pointer}
svg.fp .mkr{fill:none;stroke:var(--ink);stroke-width:2}
.evl{margin:8px 0 0;font-size:13px;line-height:1.45;color:var(--muted)}.evl b{color:var(--ink)}
/* compare + movers (spec §5, Movers brief) */
.cmpsel{display:grid;gap:8px}
select{font:15px var(--sf);padding:10px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--card);color:var(--ink);min-height:44px;width:100%}
.cmpgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmph{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;min-width:0}
.cmph .mini svg{width:96px;height:96px}.cmph b{font-size:15px}.cmph span{font-size:12px;color:var(--muted)}
.ctable{padding:4px 0}
.cr{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:8px;padding:10px 16px;border-bottom:.5px solid var(--rule);font-size:14px;font-variant-numeric:tabular-nums;align-items:center}
.cr:last-child{border-bottom:0}.cr>span:first-child{color:var(--muted)}.cr>span:not(:first-child){text-align:right}
.upc{color:var(--fp-up);font-weight:700}.dnc{color:var(--muted)}
.filt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.filt label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.filt label.sw{grid-column:1/-1;flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink);min-height:44px}
.filt input[type=checkbox]{width:22px;height:22px;accent-color:var(--ink)}
em.mv{color:var(--ink)}
#mvList{margin-top:12px}
.fl{font-size:13px;color:var(--muted)}.fl.up{color:var(--fp-up);font-weight:600}
.mvtop{margin:0 4px 10px;font-size:15px;font-weight:600}
.phk{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin-top:6px;font-size:12px;color:var(--muted)}.phk span{display:flex;align-items:center;gap:3px}.phk i{width:10px;height:10px;border-radius:2px;display:inline-block}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<div id="gate" class="wrap" hidden>
  <div class="gate">
    <img class="mark" src="icon-180.png" alt="" width="56" height="56">
    <div class="label">HoloTrack Pro · Fingerprint</div>
    <h1>Sign in</h1>
    <p class="sub" style="margin-bottom:4px">Private preview. Use your HoloTrack account.</p>
    <form id="f">
      <label for="em">E-mail</label><input id="em" type="email" autocomplete="username" required>
      <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
      <div class="msg" id="msg" role="status"></div>
    </form>
  </div>
</div>

<div id="app" hidden>
  <main class="wrap" id="view"></main>
  <nav class="tabbar" aria-label="Fingerprint">
    <button data-tab="collection"><svg viewBox="0 0 26 26"><rect x="4" y="5" width="7" height="16" rx="1.5"/><rect x="15" y="5" width="7" height="16" rx="1.5"/></svg>Collection</button>
    <button data-tab="movers"><svg viewBox="0 0 26 26"><path d="M4 18l6-6 4 4 8-8"/><path d="M17 8h5v5"/></svg>Movers</button>
    <button data-tab="compare"><svg viewBox="0 0 26 26"><path d="M13 4v18M5 9h6M5 13h6M5 17h6M15 9h6M15 13h4M15 17h5"/></svg>Compare</button>
  </nav>
</div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="s-name"></div>

<script src="app.js"></script>
</body>
</html>
